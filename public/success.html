<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message Sent</title>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #000435, #101957, #f7f3e8);
        color: #000435;
      }

      .success-card {
        width: min(520px, 90%);
        padding: 40px;
        text-align: center;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 18px 45px rgba(0, 4, 53, 0.16);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2.4rem;
      }

      p {
        color: #3f4658;
        font-size: 1.1rem;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        margin-top: 20px;
        padding: 13px 24px;
        border-radius: 999px;
        background: #ff5f1f;
        color: white;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>

  <body>
    <div class="success-card">
      <h1>Thank you!</h1>
      <p>Your message has been sent successfully.</p>
      <a href="/">Back to portfolio</a>
    </div>
  </body>
</html>
